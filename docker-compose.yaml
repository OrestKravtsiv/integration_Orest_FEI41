services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  forecast-api:
    build:
      context: .
      dockerfile: forecast-service/Dockerfile
    environment:
      MODEL_VERSION: ${MODEL_VERSION}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8001/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  orders-api:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      FORECAST_URL: http://forecast-api:8001
      FORECAST_TIMEOUT: ${FORECAST_TIMEOUT}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    secrets:
      - db_password
      - jwt_secret_key
    ports:
      - "${ORDERS_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      forecast-api:
        condition: service_started

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret_key:
    file: ./secrets/jwt_secret_key